# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, by hand (Actions tab > Build and deploy > Run workflow, or npm run deploy),
# and every morning, so posts with a future `date` go live on that date by themselves (see lib/publish.js).
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Posts go live from 05:00 UTC (midnight New York in winter). GitHub has been starting
    # scheduled runs 5 to 7 hours late, so four runs spread over the morning.
    - cron: "7 5 * * *"
    - cron: "37 6 * * *"
    - cron: "7 8 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ls _site/blog
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
